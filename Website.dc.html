<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; overflow-wrap: break-word; background: #F7F9FF; color: #334155; font-family: 'Poppins', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #2563EB; text-decoration: none; }
  a:hover { color: #7C3AED; }
  img, svg { max-width: 100%; }
</style>
<script src="./image-slot.js"></script>
</helmet>
<div ref="{{ rootRef }}">
  <sc-if value="{{ isBeranda }}" hint-placeholder-val="{{ true }}">
    <dc-import name="Beranda" hint-size="100%,900px"></dc-import>
  </sc-if>
  <sc-if value="{{ isTentang }}">
    <dc-import name="Tentang" hint-size="100%,900px"></dc-import>
  </sc-if>
  <sc-if value="{{ isBerita }}">
    <dc-import name="Berita" hint-size="100%,900px"></dc-import>
  </sc-if>
  <sc-if value="{{ isAktivitas }}">
    <dc-import name="Aktivitas" hint-size="100%,900px"></dc-import>
  </sc-if>
  <sc-if value="{{ isArtikel }}">
    <dc-import name="Artikel" hint-size="100%,900px"></dc-import>
  </sc-if>
  <sc-if value="{{ isInformasi }}">
    <dc-import name="Informasi" hint-size="100%,900px"></dc-import>
  </sc-if>
  <sc-if value="{{ isKontak }}">
    <dc-import name="Kontak" hint-size="100%,900px"></dc-import>
  </sc-if>
  <template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#C026D3"/></linearGradient></defs><rect width="300" height="200" fill="url(#wg)"/><g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M90 92 150 64l60 28-60 28-60-28Z"/><path d="M116 105v20c0 10 15 17 34 17s34-7 34-17v-20"/></g></svg></template>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const ROUTES = ['beranda', 'tentang', 'berita', 'aktivitas', 'artikel', 'informasi', 'kontak'];

class Component extends DCLogic {
  rootRef = React.createRef();
  state = { key: 'beranda', id: '1', anchor: '' };

  renderVals() {
    const k = this.state.key;
    return {
      rootRef: this.rootRef,
      isBeranda: k === 'beranda',
      isTentang: k === 'tentang',
      isBerita: k === 'berita',
      isAktivitas: k === 'aktivitas',
      isArtikel: k === 'artikel',
      isInformasi: k === 'informasi',
      isKontak: k === 'kontak',
    };
  }

  componentDidMount() {
    const root = this.rootRef.current; if (!root) return;
    const onClick = (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (/^(https?:|mailto:|tel:)/i.test(href)) return;
      const m = href.match(/^([A-Za-z]+)\.dc\.html(?:\?id=(\d+))?(?:#([\w-]+))?$/);
      if (!m) return;
      const key = m[1].toLowerCase();
      if (ROUTES.indexOf(key) < 0) return;
      e.preventDefault();
      const next = '#' + key + (m[2] ? ':' + m[2] : '') + (m[3] ? '@' + m[3] : '');
      if (window.location.hash === next) this.read(); else window.location.hash = next;
    };
    const onHash = () => this.read();
    root.addEventListener('click', onClick);
    window.addEventListener('hashchange', onHash);
    this._off = () => { root.removeEventListener('click', onClick); window.removeEventListener('hashchange', onHash); };
    this.read();
  }
  componentWillUnmount() { if (this._off) this._off(); }

  componentDidUpdate() { this.afterRoute(); }

  read() {
    const raw = (window.location.hash || '').replace(/^#/, '');
    const anchor = raw.indexOf('@') >= 0 ? raw.split('@')[1] : '';
    const head = raw.split('@')[0];
    const key = head.split(':')[0] || 'beranda';
    const id = head.split(':')[1] || '1';
    if (ROUTES.indexOf(key) < 0) return;
    const same = key === this.state.key;
    this.setState({ key: key, id: id, anchor: anchor }, () => {
      if (same) this.afterRoute();
    });
    window.scrollTo(0, 0);
  }

  afterRoute() {
    const root = this.rootRef.current; if (!root) return;
    if (this.state.key === 'artikel') {
      const id = this.state.id || '1';
      const pick = (sel, attr) => {
        const all = Array.from(root.querySelectorAll(sel));
        if (!all.length) return false;
        const hit = all.find((el) => el.getAttribute(attr) === String(id)) || all[0];
        all.forEach((el) => { el.style.display = el === hit ? '' : 'none'; });
        return true;
      };
      const ok = pick('[data-article]', 'data-article');
      pick('[data-body]', 'data-body');
      root.querySelectorAll('[data-side]').forEach((el) => {
        el.style.display = el.getAttribute('data-side') === String(id) ? 'none' : 'block';
      });
      if (!ok) setTimeout(() => this.afterRoute(), 200);
    }
    const anchor = this.state.anchor;
    if (anchor) {
      setTimeout(() => {
        const t = root.querySelector('#' + anchor);
        if (t) window.scrollTo({ top: t.getBoundingClientRect().top + (window.scrollY || 0) - 90, behavior: 'smooth' });
      }, 220);
    }
  }
}

</script>
</body>
</html>
