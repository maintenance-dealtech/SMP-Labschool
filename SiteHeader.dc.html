<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; overflow-wrap: break-word; background: #F7F9FF; color: #334155; font-family: 'Poppins', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #2563EB; text-decoration: none; }
  a:hover { color: #7C3AED; }
  input, textarea, button, select { font-family: inherit; }
  img, svg { max-width: 100%; }
  ::selection { background: #DDD6FE; color: #1E1B4B; }
</style>
<script src="./image-slot.js"></script>
</helmet>
<div ref="{{ rootRef }}" style="font-family:'Poppins',system-ui,sans-serif">
  <div data-nav-bar style="position:fixed;top:0;left:0;right:0;z-index:150;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,232,240,.9);transition:box-shadow .3s ease">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,32px);min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px">
      <a href="Beranda.dc.html" style="display:flex;align-items:center;gap:11px;flex:none">
        <image-slot id="logo-emblem" shape="circle" style="width:38px;height:38px;flex:none" placeholder="Logo"></image-slot>
        <span style="display:flex;flex-direction:column;line-height:1.1">
          <span style="font-size:13.5px;font-weight:700;color:#2563EB;letter-spacing:.02em;white-space:nowrap">SMP LABSCHOOL</span>
          <span style="font-size:9px;font-weight:600;letter-spacing:.3em;color:#94A3B8;margin-top:2px">JAKARTA</span>
        </span>
      </a>
      <nav data-desktop-nav style="display:flex;align-items:center;gap:clamp(14px,2.2vw,30px)">
        <a href="Beranda.dc.html" data-navlink="beranda" style="font-size:13.5px;font-weight:500;color:#334155;padding:4px 1px;white-space:nowrap;background-image:linear-gradient(90deg,#3B82F6,#7C3AED);background-repeat:no-repeat;background-position:0 100%;background-size:0% 2px;transition:background-size .32s cubic-bezier(.22,.61,.36,1),color .2s" style-hover="color:#2563EB;background-size:100% 2px">Beranda</a>
        <a href="Tentang.dc.html" data-navlink="tentang" style="font-size:13.5px;font-weight:500;color:#334155;padding:4px 1px;white-space:nowrap;background-image:linear-gradient(90deg,#3B82F6,#7C3AED);background-repeat:no-repeat;background-position:0 100%;background-size:0% 2px;transition:background-size .32s cubic-bezier(.22,.61,.36,1),color .2s" style-hover="color:#2563EB;background-size:100% 2px">Tentang</a>
        <a href="Berita.dc.html" data-navlink="berita" style="font-size:13.5px;font-weight:500;color:#334155;padding:4px 1px;white-space:nowrap;background-image:linear-gradient(90deg,#3B82F6,#7C3AED);background-repeat:no-repeat;background-position:0 100%;background-size:0% 2px;transition:background-size .32s cubic-bezier(.22,.61,.36,1),color .2s" style-hover="color:#2563EB;background-size:100% 2px">Berita</a>
        <a href="Aktivitas.dc.html" data-navlink="aktivitas" style="font-size:13.5px;font-weight:500;color:#334155;padding:4px 1px;white-space:nowrap;background-image:linear-gradient(90deg,#3B82F6,#7C3AED);background-repeat:no-repeat;background-position:0 100%;background-size:0% 2px;transition:background-size .32s cubic-bezier(.22,.61,.36,1),color .2s" style-hover="color:#2563EB;background-size:100% 2px">Aktivitas &amp; Prestasi</a>
        <a href="Kontak.dc.html" data-navlink="kontak" style="font-size:13.5px;font-weight:500;color:#334155;padding:4px 1px;white-space:nowrap;background-image:linear-gradient(90deg,#3B82F6,#7C3AED);background-repeat:no-repeat;background-position:0 100%;background-size:0% 2px;transition:background-size .32s cubic-bezier(.22,.61,.36,1),color .2s" style-hover="color:#2563EB;background-size:100% 2px">Kontak</a>
      </nav>
      <div style="display:flex;align-items:center;gap:10px;flex:none">
        <a href="Informasi.dc.html" data-cta style="background:linear-gradient(135deg,#3B82F6 0%,#7C3AED 100%);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.08em;padding:11px 20px;border-radius:10px;white-space:nowrap;box-shadow:0 8px 20px rgba(99,102,241,.34);transition:transform .25s cubic-bezier(.22,.61,.36,1),box-shadow .25s" style-hover="transform:translateY(-2px);box-shadow:0 14px 28px rgba(99,102,241,.44);color:#fff">INFORMASI</a>
        <button type="button" data-burger aria-label="Menu" style="display:none;width:42px;height:42px;border-radius:12px;border:1px solid #E2E8F5;background:#fff;color:#2563EB;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .25s" style-hover="background:#EEF2FF">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
        </button>
      </div>
    </div>
    <div data-mobile-nav style="display:none;border-top:1px solid #EEF2F8;background:#fff;padding:10px clamp(16px,4vw,32px) 16px">
      <a href="Beranda.dc.html" style="display:block;padding:12px 4px;font-size:14px;font-weight:500;color:#334155;border-bottom:1px solid #F1F5F9">Beranda</a>
      <a href="Tentang.dc.html" style="display:block;padding:12px 4px;font-size:14px;font-weight:500;color:#334155;border-bottom:1px solid #F1F5F9">Tentang</a>
      <a href="Berita.dc.html" style="display:block;padding:12px 4px;font-size:14px;font-weight:500;color:#334155;border-bottom:1px solid #F1F5F9">Berita</a>
      <a href="Aktivitas.dc.html" style="display:block;padding:12px 4px;font-size:14px;font-weight:500;color:#334155;border-bottom:1px solid #F1F5F9">Aktivitas &amp; Prestasi</a>
      <a href="Kontak.dc.html" style="display:block;padding:12px 4px;font-size:14px;font-weight:500;color:#334155;border-bottom:1px solid #F1F5F9">Kontak</a>
      <a href="Informasi.dc.html" style="display:block;margin-top:12px;text-align:center;background:linear-gradient(135deg,#3B82F6,#7C3AED);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.06em;padding:13px 18px;border-radius:12px">INFORMASI</a>
    </div>
  </div>
  <div data-nav-spacer style="height:74px"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;beranda&quot;,&quot;tentang&quot;,&quot;berita&quot;,&quot;aktivitas&quot;,&quot;kontak&quot;,&quot;&quot;],&quot;default&quot;:&quot;beranda&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef();
  renderVals() { return { rootRef: this.rootRef }; }

  componentDidMount() {
    this.paintActive();
    this.wire();
  }
  componentDidUpdate() { this.paintActive(); }
  componentWillUnmount() { (this._off || []).forEach((f) => f()); }

  paintActive() {
    const root = this.rootRef.current; if (!root) return;
    const active = this.props.active || '';
    root.querySelectorAll('[data-navlink]').forEach((a) => {
      const on = a.getAttribute('data-navlink') === active;
      a.style.color = on ? '#2563EB' : '#334155';
      a.style.fontWeight = on ? '600' : '500';
      a.style.backgroundSize = on ? '100% 2px' : '0% 2px';
    });
  }

  wire() {
    const root = this.rootRef.current; if (!root) return;
    const off = (this._off = []);
    const bar = root.querySelector('[data-nav-bar]');
    const spacer = root.querySelector('[data-nav-spacer]');
    const desktop = root.querySelector('[data-desktop-nav]');
    const mobile = root.querySelector('[data-mobile-nav]');
    const burger = root.querySelector('[data-burger]');
    const cta = root.querySelector('[data-cta]');
    let open = false;

    const layout = () => {
      const narrow = window.innerWidth < 940;
      if (desktop) desktop.style.display = narrow ? 'none' : 'flex';
      if (burger) burger.style.display = narrow ? 'flex' : 'none';
      if (cta) cta.style.display = window.innerWidth < 420 ? 'none' : 'inline-flex';
      if (!narrow) { open = false; if (mobile) mobile.style.display = 'none'; }
      if (spacer && bar) spacer.style.height = bar.offsetHeight + 'px';
    };
    const shadow = () => { if (bar) bar.style.boxShadow = (window.scrollY || 0) > 20 ? '0 10px 30px rgba(22,44,92,.10)' : 'none'; };

    if (burger) {
      const t = () => {
        open = !open;
        if (mobile) mobile.style.display = open ? 'block' : 'none';
        if (spacer && bar) spacer.style.height = bar.offsetHeight + 'px';
      };
      burger.addEventListener('click', t);
      off.push(() => burger.removeEventListener('click', t));
    }
    window.addEventListener('resize', layout);
    window.addEventListener('scroll', shadow, { passive: true });
    off.push(() => window.removeEventListener('resize', layout));
    off.push(() => window.removeEventListener('scroll', shadow));
    layout();
    shadow();
    setTimeout(layout, 400);
  }
}

</script>
</body>
</html>
